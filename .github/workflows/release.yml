# Publish Muster desktop artifacts to GitHub Releases so electron-updater can
# discover them via the generic feed in src/main/updater-release-feed-source.ts.
#
# Feed shape (must match electron-builder publish output):
#   https://github.com/jefrontv/muster/releases/latest/download/latest-mac.yml
#   https://github.com/jefrontv/muster/releases/download/vX.Y.Z/...
#
# Trigger: push a package.json version bump to muster, or run manually. The
# workflow creates the vX.Y.Z tag itself when it publishes the release.
# Why a branch trigger and not a tag: GitHub Actions caches are only shared
# within one ref (or with the default branch). A run per tag ref never sees the
# pnpm store cached by the previous release, so every release re-downloaded all
# deps. Runs on refs/heads/muster share one cache. It also means upstream orca
# tags synced into this repo can never start a build here.
# Signing/notarization: set MAC_CERTS + Apple notary secrets for production
# builds; without them the workflow still publishes an ad-hoc arm64 package
# suitable for private/team installs.

name: Release

on:
  push:
    branches:
      - muster
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to the default branch.
        required: false
        type: string
      force:
        description: Rebuild even if this version's tag already exists (the stale release is replaced; the tag stays).
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide whether this commit is a release: package.json's version with no
  # matching tag yet. Runs on a cheap runner so a non-release package.json edit
  # never spins up the mac builder.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      # Why: a committed `node_modules` symlink (easy to miss — .gitignore's
      # `node_modules/` pattern never matched it) makes every install die with
      # ENOTDIR after checkout recreates it. Fail loud instead of mid-release.
      - name: Reject tracked node_modules entry
        run: |
          if git ls-files --error-unmatch node_modules >/dev/null 2>&1; then
            echo "::error::node_modules is tracked in git - remove it (git rm --cached node_modules)"
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 && [[ "$FORCE" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists - nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${TAG} from ${SHA}"
          fi

  # Why a separate job: tsc took 40s of the mac runner's critical path. Running
  # it here in parallel costs no wall time, and `publish` below refuses to
  # undraft the release unless it passes. Commits land on muster without PRs,
  # so this is the only typecheck gate a release gets.
  typecheck:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zlib1g-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Pin pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store" --global

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # Why: pnpm's bundled node-gyp ships gyp_main.py without execute
      # permission, which breaks node-pty's postinstall on Linux runners.
      # Same pin as pr.yml.
      - name: Use external node-gyp to avoid pnpm's bundled copy
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        # Why: pnpm's frozen headless fast path can fail on fresh Ubuntu runners
        # while creating the root node_modules (see pr.yml).
        run: |
          pnpm install --no-frozen-lockfile --prefer-frozen-lockfile=false
          git diff --exit-code package.json pnpm-lock.yaml

      - name: Typecheck
        run: pnpm run typecheck

  release-mac:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # electron-builder GitHub publisher
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Why arm64-only: team fleet is Apple Silicon; the x64 slice doubled
      # package+sign time. The config's per-target arch list overrides
      # electron-builder's CLI arch flags, so this env is the only switch.
      MUSTER_MAC_ARCHS: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Why: PNPM_HOME points at setup-pnpm's .bin, so `pnpm store path` resolves
      # to a throwaway dir there and setup-node's cache never hits. Pin the
      # store somewhere cacheable first.
      - name: Pin pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store" --global

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Why: publish config uses releaseType 'release', and electron-builder only adopts
      # DRAFT releases — a leftover published release from a failed run makes every retry
      # die with 422 already_exists. Drop the release (tag survives) so re-runs are clean.
      - name: Clear stale release for tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true

      # Why: electron-builder's parallel upload tasks race to CREATE the release
      # (it only adopts existing DRAFT releases) — one wins, the rest die with
      # 422 already_exists mid-publish. Pre-creating the draft removes the race.
      # --target pins the commit the tag is created on when `publish` undrafts it.
      - name: Pre-create draft release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: gh release create "$TAG" --draft --title "$TAG" --notes "" --target "$SHA" --repo "${{ github.repository }}" || true

      # Why on the release rather than in the app bundle alone: the Extension Hub fetches this file
      # at runtime from /releases/latest/download, so a build that ships the catalog but never
      # publishes it leaves every installed copy falling back to whatever it was built with.
      - name: Upload extension catalog
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          node config/scripts/verify-extension-catalog.mjs
          gh release upload "$TAG" resources/extensions/extension-catalog.json \
            --clobber --repo "${{ github.repository }}"

      # Typecheck runs in the parallel `typecheck` job, so this is build:desktop
      # minus `pnpm run typecheck`.
      - name: Build desktop + native mac helpers
        env:
          # Baked into the main bundle by electron-vite's define block; without
          # them the packaged app has no Bitbucket OAuth consumer and the
          # Connect dialog dead-ends (src/main/bitbucket/oauth-config.ts).
          ORCA_BITBUCKET_OAUTH_CLIENT_ID: ${{ secrets.ORCA_BITBUCKET_OAUTH_CLIENT_ID }}
          ORCA_BITBUCKET_OAUTH_CLIENT_SECRET: ${{ secrets.ORCA_BITBUCKET_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pnpm run build:relay
          pnpm run build:cli
          pnpm run build:electron-vite
          pnpm run build:web
          # --single-arch builds the helper for the host arch (arm64), matching MUSTER_MAC_ARCHS.
          pnpm run build:notification-status-macos -- --single-arch
          pnpm run ensure:electron-runtime

      - name: Package and publish macOS arm64
        # electron-builder --publish always uploads latest-mac.yml + zip/dmg to the
        # draft release created above so the in-app updater can find them.
        env:
          # Optional signing — these stay under MAC_* names so an unset secret never
          # reaches electron-builder as an empty CSC_LINK (it resolves "" to the repo
          # root and dies with "not a file").
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CERTS:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            export CSC_LINK="${MAC_CERTS}"
            export CSC_KEY_PASSWORD="${MAC_CERTS_PASSWORD:-}"
            export ORCA_MAC_RELEASE=1
            echo "Signed/notarized release path enabled"
          elif [[ -n "${MAC_CERTS:-}" ]]; then
            # Why this path exists: Squirrel.Mac refuses an update whose signature does not satisfy
            # the INSTALLED app's designated requirement, so an unsigned CI build can never replace
            # a locally signed one ("code failed to satisfy specified code requirement(s)"). Signing
            # releases with the same certificate the team installs with makes auto-update work
            # without an Apple Developer ID. Notarization is impossible for a self-signed cert, so
            # it stays off and Gatekeeper still needs `xattr -cr` on first install.
            # Why a keychain script instead of CSC_LINK: electron-builder imports a .p12 without
            # trust settings, and a self-signed root then reads as CSSMERR_TP_NOT_TRUSTED, so its
            # identity search skips it and silently ships an UNSIGNED build. The script imports,
            # trusts, verifies, and prints the identity to sign as.
            CSC_NAME_VALUE="$(bash config/scripts/setup-mac-self-signed-keychain.sh)"
            export CSC_NAME="${CSC_NAME_VALUE}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export MUSTER_MAC_SIGNED_NO_NOTARIZE=1
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "Signed (no notarization) release path enabled as '${CSC_NAME_VALUE}'"
          else
            # Ad-hoc signing path: electron-builder must see no CSC/Apple credentials at all.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Ad-hoc package path (no MAC_CERTS / Apple notary secrets)"
          fi
          pnpm exec electron-builder \
            --config config/electron-builder.config.cjs \
            --mac \
            --publish always

  # Undrafting is what makes /releases/latest move and creates the git tag, so
  # it waits for both the artifacts and the typecheck. A failed typecheck leaves
  # the draft in place for inspection and the feed untouched.
  publish:
    needs: [resolve, release-mac, typecheck]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
