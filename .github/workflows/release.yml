# Publish Muster desktop artifacts to GitHub Releases so electron-updater can
# discover them via the generic feed in src/main/updater-release-feed-source.ts.
#
# Feed shape (must match electron-builder publish output):
#   https://github.com/jefrontv/muster/releases/latest/download/latest-mac.yml
#   https://github.com/jefrontv/muster/releases/download/vX.Y.Z/...
#
# Trigger: push a version tag (v1.2.3 or v1.2.3-rc.1) or run manually.
# Signing/notarization: set MAC_CERTS + Apple notary secrets for production
# builds; without them the workflow still publishes an ad-hoc arm64 package
# suitable for private/team installs.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to the default branch.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Muster-line tags only: this repo also receives upstream orca tags via
  # branch syncs, and building those poisons the update feed with upstream
  # binaries (see src/main/updater-release-feed-source.ts).
  guard:
    runs-on: ubuntu-latest
    outputs:
      muster: ${{ steps.check.outputs.muster }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Verify tag is on muster
        id: check
        run: |
          git fetch origin muster --quiet
          if git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/muster; then
            echo "muster=true" >> "$GITHUB_OUTPUT"
          else
            echo "muster=false" >> "$GITHUB_OUTPUT"
            echo "Ref is not on muster - skipping release build."
          fi

  release-mac:
    needs: guard
    if: needs.guard.outputs.muster == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # electron-builder GitHub publisher
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch on a branch: use package.json version
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (${VERSION})"

      - name: Align package.json version with tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

      # Why: publish config uses releaseType 'release', and electron-builder only adopts
      # DRAFT releases — a leftover published release from a failed run makes every retry
      # die with 422 already_exists. Drop the release (tag survives) so re-runs are clean.
      - name: Clear stale release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true

      # Why: electron-builder's parallel upload tasks race to CREATE the release
      # (it only adopts existing DRAFT releases) — one wins, the rest die with
      # 422 already_exists mid-publish. Pre-creating the draft removes the race;
      # the "Ensure release is not draft" step below publishes it at the end.
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --draft --title "$TAG" --notes "" --repo "${{ github.repository }}" || true

      - name: Build desktop + native mac helpers
        run: |
          pnpm run build:desktop
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime

      - name: Package and publish macOS arm64
        # Why arm64-only: team fleet is Apple Silicon; dual-arch doubles CI time.
        # electron-builder --publish always creates/updates the GitHub Release and
        # uploads latest-mac.yml + zip/dmg so the in-app updater can find them.
        env:
          # Optional signing — these stay under MAC_* names so an unset secret never
          # reaches electron-builder as an empty CSC_LINK (it resolves "" to the repo
          # root and dies with "not a file").
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CERTS:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            export CSC_LINK="${MAC_CERTS}"
            export CSC_KEY_PASSWORD="${MAC_CERTS_PASSWORD:-}"
            export ORCA_MAC_RELEASE=1
            echo "Signed/notarized release path enabled"
          elif [[ -n "${MAC_CERTS:-}" ]]; then
            # Why this path exists: Squirrel.Mac refuses an update whose signature does not satisfy
            # the INSTALLED app's designated requirement, so an unsigned CI build can never replace
            # a locally signed one ("code failed to satisfy specified code requirement(s)"). Signing
            # releases with the same certificate the team installs with makes auto-update work
            # without an Apple Developer ID. Notarization is impossible for a self-signed cert, so
            # it stays off and Gatekeeper still needs `xattr -cr` on first install.
            # Why a keychain script instead of CSC_LINK: electron-builder imports a .p12 without
            # trust settings, and a self-signed root then reads as CSSMERR_TP_NOT_TRUSTED, so its
            # identity search skips it and silently ships an UNSIGNED build. The script imports,
            # trusts, verifies, and prints the identity to sign as.
            CSC_NAME_VALUE="$(bash config/scripts/setup-mac-self-signed-keychain.sh)"
            export CSC_NAME="${CSC_NAME_VALUE}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export MUSTER_MAC_SIGNED_NO_NOTARIZE=1
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "Signed (no notarization) release path enabled as '${CSC_NAME_VALUE}'"
          else
            # Ad-hoc signing path: electron-builder must see no CSC/Apple credentials at all.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Ad-hoc package path (no MAC_CERTS / Apple notary secrets)"
          fi
          pnpm exec electron-builder \
            --config config/electron-builder.config.cjs \
            --mac \
            --arm64 \
            --publish always

      - name: Ensure release is not draft
        if: success()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # electron-builder may leave a draft depending on config; undraft so /latest works.
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}" || true
